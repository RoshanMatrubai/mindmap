name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Mac (lint, package tests, Debug and Release builds)
    # Newest generally available macOS runner; its default Xcode is 26.x (the project minimum).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Release build
        run: make build CONFIG=Release
      - name: Tree is clean (data rule)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed or created tracked/untracked files:"
            git status --porcelain
            exit 1
          fi

  ipad:
    # Builds only: the package tests run once, in the Mac job. The runner has no custom simulators,
    # so this builds for a generic iOS Simulator destination (make ipad-build), unsigned.
    name: iPad simulator build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: xcodebuild -version && xcrun simctl list runtimes
      - name: iPad Debug build
        run: make ipad-build
      - name: iPad Release build
        run: make ipad-build CONFIG=Release
      - name: Tree is clean (data rule)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed or created tracked/untracked files:"
            git status --porcelain
            exit 1
          fi

  ipad-smoke:
    # The touch harness (App/iPad/Debug/TouchSmoke.swift) drives every gesture through DEBUG hooks
    # in a booted simulator, then launch hooks stage screenshots. The Mac smoke harness needs
    # a frontmost window, so it stays a local run.
    name: iPad simulator smoke (touch harness and screenshots)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Pick an iPad simulator
        run: |
          xcrun simctl list devices available
          list=$(xcrun simctl list devices available)
          name() { sed -E 's/^ +//; s/ \([0-9A-F]{8}-[0-9A-F-]{27}\) \(.*$//' | head -1; }
          sim=$(echo "$list" | grep -E '^ +iPad Pro ' | name)
          [ -n "$sim" ] || sim=$(echo "$list" | grep -E '^ +iPad ' | name)
          [ -n "$sim" ] || { echo "no iPad simulator on this runner"; exit 1; }
          echo "Using simulator: $sim"
          echo "SIM=$sim" >> "$GITHUB_ENV"
      - name: Touch smoke harness
        run: |
          mkdir -p build/ipad-artifacts
          make ipad-run SIM="$SIM" ARGS="-fixture sample -editor-smoke YES"
          log=build/ipad-artifacts/ipad-smoke.log
          for i in $(seq 1 90); do
            make -s ipad-logs LAST=20m > "$log" 2>&1 || true
            grep -q "touch smoke complete" "$log" && break
            sleep 10
          done
          grep -E "smoke (PASS|FAIL)|touch smoke complete" "$log" || true
          grep -q "touch smoke complete" "$log" || { echo "::error::the harness never finished"; exit 1; }
          if grep -q "smoke FAIL" "$log"; then
            grep "smoke FAIL" "$log" | sed 's/^/::error::/'
            exit 1
          fi
          grep "touch smoke complete" "$log"
      - name: Screenshots (graph states, layouts, keyboard bar)
        if: always()
        run: |
          stage() {
            since=$(date '+%Y-%m-%d %H:%M:%S')
            make ipad-run SIM="$SIM" ARGS="-fixture sample $2"
            for i in $(seq 1 30); do
              make -s ipad-logs SINCE="$since" > build/stage.log 2>&1 || true
              grep -q "debug stage ready: $3" build/stage.log && break
              sleep 2
            done
            grep "debug stage ready" build/stage.log || echo "::warning::stage $1 not reported"
            make ipad-screenshot && cp build/ipad-screenshot.png "build/ipad-artifacts/$1.png"
          }
          stage selected-branch "-layout narrow -pane map -select-node garden" "select garden"
          stage long-press-menu "-layout narrow -pane map -show-menu 'fix the fence'" "menu fix the fence"
          stage mid-rename "-layout narrow -pane map -select-node 'plant herbs' -rename-node YES" "rename plant herbs"
          stage landscape-side-by-side "-orientation landscape -select-node garden" "select garden"
          stage portrait-text "-orientation portrait -layout narrow -pane text" "layout"
          stage portrait-map "-orientation portrait -layout narrow -pane map" "layout"
          stage keyboard-bar "-orientation portrait -layout narrow -pane text -focus-editor YES" "editor focused"
          make ipad-logs LAST=10m > build/ipad-artifacts/ipad-screenshots.log 2>&1 || true
          make ipad-stop
      - name: Screenshot previews in the log
        # Small JPEGs as base64, for readers that can see the log but not the artifacts.
        if: always()
        run: |
          for f in build/ipad-artifacts/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 60 -Z 640 "$f" --out /tmp/preview.jpg >/dev/null
            echo "preview-begin $(basename "$f")"
            base64 -i /tmp/preview.jpg | tr -d '\n'
            echo
            echo "preview-end $(basename "$f")"
          done
      - name: Upload log and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-smoke
          path: build/ipad-artifacts
          if-no-files-found: warn
